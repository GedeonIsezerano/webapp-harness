[project]
name = "webapp-harness-plugin"
version = "0.1.0"
description = "Development and validation tooling for the Webapp Harness plugin"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "jsonschema>=4.20,<5",
  "pytest>=8,<9",
  "pyyaml>=6,<7",
]

[tool.pytest.ini_options]
testpaths = [
  "tests",
]
addopts = "-q"
